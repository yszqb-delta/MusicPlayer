<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手动补词 · 音乐播放器</title>
  <link rel="stylesheet" href="/static/css/style.css?v=20261101b">
</head>
<body>
  <div class="home-bg"></div>
  <div class="app" style="max-width:860px">
    <header class="topbar">
      <h1 class="logo"><a href="/" style="color:inherit;text-decoration:none">♪ 手动补词</a></h1>
      <div class="topbar-actions">
        <span id="needy-count" class="hint-text"></span>
        <button id="btn-reload" class="ghost-btn">刷新</button>
      </div>
    </header>

    <main>
      <p class="empty-hint" style="margin-top:18px">
        这里列出「没有歌词或只有作词作曲信息」的歌。粘贴 / 上传 LRC 后保存即生效；
        纯音乐可以只留一行说明，也可以点「试试自动补词」让网站找词 + AI 校对。
      </p>
      <ul id="needy-list" class="song-list"></ul>
      <p id="all-done" class="empty-hint" hidden>全都齐了，没有缺歌词的歌 🎉</p>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="/static/js/lyrfix.js?v=20261101a"></script>
</body>
</html>
